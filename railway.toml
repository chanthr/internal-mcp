# Railway deployment. Uses the Dockerfile (ENTRYPOINT knowledge-mcp, CMD serve), /health for health checks.
# The SQLite store needs a volume mounted at /data. Without one, keys and users are lost on every redeploy.
# No volume? Set MCP_STORE=supabase to keep state in Supabase instead. Pass the config as MCP_CONFIG_JSON.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

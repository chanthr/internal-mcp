# Railway deployment. Uses the Dockerfile (ENTRYPOINT knowledge-mcp, CMD serve), /health for health checks.
# The SQLite store needs a volume mounted at /data; otherwise set MCP_STORE=supabase (state lost on redeploy).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

name: Bug report
description: Something behaves differently from the code or the docs.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Remove API keys, tokens, passwords, service account JSON, internal URLs and private documents before you post.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which tool or endpoint you called, and what you got back.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: input
    id: env
    attributes:
      label: Environment
      description: Transport (http or stdio), Node version, host (Docker, Railway, local), commit
  - type: checkboxes
    id: privacy
    attributes:
      label: Check
      options:
        - label: I removed secrets and private data from this issue
          required: true

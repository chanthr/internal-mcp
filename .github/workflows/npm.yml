# Publishes @chnxthr/knowledge-mcp and create-knowledge-mcp to npm on version tags (v*.*.*).
# Needs the NPM_TOKEN repository secret (an npm automation token); without it the job skips with a warning.
name: npm

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in packages/knowledge-mcp packages/create-knowledge-mcp; do
            got="$(node -p "require('./$p/package.json').version")"
            if [ "$got" != "$v" ]; then echo "::error::$p is $got, tag is $v"; exit 1; fi
          done
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN is not set — skipping publish"; exit 0; fi
          npm publish -w @chnxthr/knowledge-mcp --provenance --access public
          npm publish -w create-knowledge-mcp --provenance --access public

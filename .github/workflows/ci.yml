# Typecheck, unit + end-to-end tests (with a real Qdrant), the scaffold smoke test (pack → create → install → build →
# serve → call), and a clean-install check of the packed package (no deprecation warnings, npm audit clean).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # A real Qdrant for the vector store client test (test/qdrant.test.ts skips without QDRANT_TEST_URL).
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    env:
      QDRANT_TEST_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:create
      - run: npm run check:install
